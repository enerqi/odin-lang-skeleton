name: release

on:
  push:
    # Both spellings are accepted. `v1.2.3` is the common git convention (git itself, the Linux
    # kernel, and Go where the prefix is mandatory), but SemVer is explicit that `v1.2.3` is not a
    # semantic version - the `v` belongs to the tag, not the version - and plenty of projects tag
    # bare, Rust among them. Requiring one spelling means tagging the other does nothing at all, with
    # no error to explain the silence, so both trigger and the `v` is stripped for the version stamp.
    # The patterns are anchored on a digit so an unrelated tag like `verify-something` is ignored.
    tags:
      - "v[0-9]*"
      - "[0-9]*"
  # Lets the matrix be exercised without cutting a tag; the upload step is skipped for these.
  workflow_dispatch:

permissions:
  contents: write # required to create the release and attach binaries

env:
  ODIN_RELEASE: nightly # see .github/workflows/ci.yml for why this is not `latest`

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # `asset` must be unique per release - GitHub rejects two assets with the same name - so the
        # platform lives in the *archive* name and the binary inside is plainly `odin-skel`. That is
        # what the user ends up with on their PATH, with no renaming step. tar also preserves the
        # executable bit, so there is no `chmod +x` to explain either.
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            binary: odin-skel.exe
            bin_name: odin-skel
            asset: odin-skel-linux-x86_64.tar.gz
          - os: windows-latest
            target: windows-x86_64
            binary: odin-skel.exe
            bin_name: odin-skel.exe
            asset: odin-skel-windows-x86_64.zip
          # macOS runners are pinned rather than tracking `-latest`, and deliberately to an older
          # release than CI uses. A macOS binary runs on its build version and newer but not older,
          # so `-latest` silently raising the OS baseline of a published binary - which it does when
          # GitHub migrates the label - would drop users with no commit to point at.
          #
          # macos-13 was the Intel runner here until it was retired: the job then sat queued forever
          # and, because publish needs the whole matrix, blocked the release entirely. `macos-15-intel`
          # replaces it and is a standard runner, so it stays free on public repositories.
          - os: macos-15
            target: macos-arm64
            binary: odin-skel.exe
            bin_name: odin-skel
            asset: odin-skel-macos-arm64.tar.gz
          - os: macos-15-intel
            target: macos-x86_64
            binary: odin-skel.exe
            bin_name: odin-skel
            asset: odin-skel-macos-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: extractions/setup-just@v4

      # `changelog_section` (used by preflight below and again in the publish job) is a `[script]`
      # recipe running on `uv run -p 3.14 python` - see the justfile's `set script-interpreter`. uv is
      # not preinstalled on GitHub's runners the way python is, so it needs its own setup step; it then
      # downloads the pinned 3.14 itself on first use.
      - uses: astral-sh/setup-uv@v9.0.0

      # Deliberately before setup-odin, which is the slow step. The release notes are assembled in
      # the publish job, so a tag with no CHANGELOG.md section used to fail only after all four
      # platforms had compiled, tested, archived and uploaded - minutes of work to report a missing
      # heading. Checking here fails within seconds of the job starting instead.
      # Skipped for workflow_dispatch, where the ref is a branch rather than a version.
      - name: preflight - the tag has release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: just changelog_section "${GITHUB_REF_NAME}" > /dev/null

      - uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: ${{ env.ODIN_RELEASE }}

      # A release must not ship a binary whose embedded templates disagree with the tagged tree.
      - name: embed-check
        run: just embed-check

      - name: test odin-skel
        run: just test_skel

      # A tag build reports the tag without its leading `v`; a manual run is stamped with the short
      # SHA so a dispatched artifact can never be mistaken for a release.
      - name: resolve version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi
          echo "SKEL_VERSION=$version" >> "$GITHUB_ENV"
          echo "building version $version"

      # Built through the recipe rather than a bare `odin build` so what CI ships and what a
      # developer can reproduce locally cannot drift apart.
      - name: build
        run: just build_skel_release -define:SKEL_VERSION=${{ env.SKEL_VERSION }}

      # Guards against the stamp silently not taking effect - a release that reports "dev" would be
      # useless for bug reports and impossible to tell apart from a local build.
      - name: verify the stamped version
        shell: bash
        run: |
          set -euo pipefail
          reported="$(./target/release/${{ matrix.binary }} version)"
          expected="odin-skel $SKEL_VERSION"
          echo "reported: $reported"
          if [ "$reported" != "$expected" ]; then
            echo "expected: $expected" >&2
            exit 1
          fi

      # The build output is always `odin-skel.exe`, matching the skeleton's own `main.exe` convention
      # on every platform, so it is renamed here to what the user should actually end up with.
      - name: stage the asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist stage
          cp "target/release/${{ matrix.binary }}" "stage/${{ matrix.bin_name }}"
          cp LICENSE stage/
          cd stage
          case "${{ matrix.asset }}" in
            *.zip)    7z a -tzip "../dist/${{ matrix.asset }}" * > /dev/null ;;
            *.tar.gz) tar czf "../dist/${{ matrix.asset }}" * ;;
            *)        echo "unhandled archive type: ${{ matrix.asset }}" >&2; exit 1 ;;
          esac

      # Cheap guard against an archive that is empty, nested one directory too deep, or holding a
      # binary under the wrong name - all silent failures that only surface when a user unpacks it.
      - name: verify the archive contents
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.asset }}" in
            *.zip)    listing="$(7z l -ba "dist/${{ matrix.asset }}")" ;;
            *.tar.gz) listing="$(tar tzf "dist/${{ matrix.asset }}")" ;;
          esac
          echo "$listing"
          echo "$listing" | grep -q "${{ matrix.bin_name }}$" \
            || { echo "archive does not contain ${{ matrix.bin_name }}" >&2; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: build
    # Any tag, not just the `v` spelling - the trigger already restricts which tags get here, and
    # gating on `refs/tags/v` would build a bare `1.2.3` tag and then silently never publish it.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      # Needed for CHANGELOG.md - this job had nothing checked out before.
      - uses: actions/checkout@v4
      - uses: extractions/setup-just@v4

      # `changelog_section` below is a `[script]` recipe running on `uv run -p 3.14 python` - see the
      # note on the same step in the `build` job above.
      - uses: astral-sh/setup-uv@v9.0.0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # GitHub's generated notes list merged pull requests only, so on a repo that pushes straight to
      # master they come out nearly empty. The changelog section is prepended to them: the action's
      # contract is "if body is specified, the body will be pre-pended to the automatically generated
      # notes", so the release ends up with the curated summary first and the PR list beneath it.
      # A tag with no matching section fails here rather than publishing an empty release.
      - name: release notes from CHANGELOG.md
        run: just changelog_section "${GITHUB_REF_NAME}" > release-notes.md

      - name: preview notes
        run: cat release-notes.md

      # Generated after the download so one file covers every target. The binaries are unsigned, so
      # this is the only way a user can check that what they downloaded is what CI built.
      - name: checksums
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Built here rather than committed, because the hash cannot exist until the archives do - which
      # is after the tag. Committing it would always mean a follow-up commit landing after the tag it
      # describes, with a window where scoop users get the previous version. As a release asset the
      # install URL is `releases/latest/download/odin-skel.json`, which GitHub keeps pointing at the
      # newest release forever.
      #
      # Deliberately after the checksums step: SHA256SUMS covers the archives, and a manifest that
      # embeds one of those hashes cannot also be inside the file it reads.
      - name: scoop manifest
        shell: bash
        run: |
          set -euo pipefail
          # This job only runs for tags, so the ref name is the version; same `v` strip as the build.
          export SKEL_VERSION="${GITHUB_REF_NAME#v}"
          python3 - <<'PY'
          import json, os, sys

          version = os.environ["SKEL_VERSION"]
          asset = "odin-skel-windows-x86_64.zip"

          with open("packaging/scoop/odin-skel.json", encoding="utf-8") as f:
              manifest = json.load(f)

          digest = None
          with open("dist/SHA256SUMS", encoding="utf-8") as f:
              for line in f:
                  parts = line.split()
                  if len(parts) == 2 and parts[1].lstrip("*") == asset:
                      digest = parts[0]
                      break
          if digest is None:
              sys.exit(asset + " missing from SHA256SUMS")

          base = "https://github.com/enerqi/odin-lang-skeleton/releases/download/" + version
          manifest.pop("##", None)
          manifest["version"] = version
          manifest["architecture"]["64bit"]["url"] = base + "/" + asset
          manifest["architecture"]["64bit"]["hash"] = digest

          with open("dist/odin-skel.json", "w", encoding="utf-8", newline="\n") as f:
              json.dump(manifest, f, indent=4)
              f.write("\n")
          print(json.dumps(manifest, indent=4))
          PY

      - name: list assets
        run: ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
          generate_release_notes: true
          fail_on_unmatched_files: true
